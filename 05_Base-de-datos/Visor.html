<title>Diseño instruccional — CETEMIN</title>
<style>
 :root{--tinta:#1c2430;--suave:#5b6675;--linea:#e2e6eb;--fondo:#f6f7f9;
       --acento:#17545e;--aviso:#b4541a;--ok:#2d6a4f}
 *{box-sizing:border-box}
 body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--tinta);background:var(--fondo)}
 header{background:var(--acento);color:#fff;padding:14px 22px}
 header b{font-size:17px}
 header span{opacity:.75;margin-left:10px;font-size:13px}
 .cols{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 52px)}
 aside{background:#fff;border-right:1px solid var(--linea);overflow:auto;max-height:calc(100vh - 52px)}
 main{padding:22px 26px;overflow:auto;max-height:calc(100vh - 52px)}
 .filtros{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
 .filtros button{border:1px solid var(--linea);background:#fff;border-radius:6px;
      padding:4px 10px;cursor:pointer;font-size:13px}
 .filtros button.on{background:var(--acento);color:#fff;border-color:var(--acento)}
 .curso{padding:9px 14px;border-bottom:1px solid #f1f3f5;cursor:pointer;font-size:14px}
 .curso:hover{background:#f0f4f5}
 .curso.on{background:#e6eef0;border-left:3px solid var(--acento);padding-left:11px}
 .curso small{display:block;color:var(--suave);font-size:12px}
 .modulo{padding:7px 14px;background:#fafbfc;font-size:11px;letter-spacing:.5px;
      text-transform:uppercase;color:var(--suave);border-bottom:1px solid var(--linea)}
 h1{font-size:21px;margin:0 0 4px}
 h2{font-size:16px;margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--linea)}
 .meta{color:var(--suave);font-size:13px;margin-bottom:16px}
 .caja{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:14px 16px;margin-bottom:12px}
 .ind{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--linea)}
 .ind b{color:var(--acento)}
 .ses{background:#fff;border:1px solid var(--linea);border-radius:8px;margin-bottom:9px;overflow:hidden}
 .ses>div:first-child{padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
 .ses>div:first-child:hover{background:#f7f9fa}
 .n{background:var(--acento);color:#fff;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:600;flex-shrink:0}
 .n.ev{background:var(--aviso)}
 .ae{font-size:13.5px}
 .ae small{display:block;color:var(--suave);margin-top:3px;font-size:12.5px}
 .detalle{display:none;padding:0 14px 14px;border-top:1px solid var(--linea)}
 .detalle.on{display:block}
 .sub{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);margin:14px 0 6px}
 ul{margin:0;padding-left:18px}
 li{margin:3px 0;font-size:13.5px}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
 th{color:var(--suave);font-weight:600;font-size:11.5px;text-transform:uppercase}
 .mom{border-radius:4px;padding:1px 7px;font-size:11.5px;white-space:nowrap;color:#fff}
 .m-conexion{background:#4c6ef5}.m-adquisicion{background:#0b7285}
 .m-aplicacion{background:#2d6a4f}.m-discusion{background:#9c6644}.m-reflexion{background:#5f3dc4}
 .val{font-size:13px;padding:5px 0}
 .val b{font-family:ui-monospace,monospace}
 .si{color:var(--ok)}.no{color:var(--aviso)}
 .vacio{color:var(--suave);font-style:italic;font-size:13.5px}
</style></head><body>

 controlaría el técnico en cada operación, y una comparación de ambos por condiciones geológicas/geomecánicas (sin costos ni productividad). Producto: informe + sustentación. Roles por integrante: operaciones unitarias / corte y relleno / sub level stoping / controles+comparación.", "pregunta_gatilladora": "¿Por qué los equipos, materiales y controles de una operación cambian según el método y las condiciones del macizo, y por qué es clave describirlos bien antes de que se elija uno?", "recursos": "Libro de métodos de explotación subterránea; fichas de equipos (jackleg, jumbo, scooptram); ficha de datos de la Veta Esperanza; videos de operaciones unitarias", "producto": "PPT de 8 a 10 diapositivas con: (1) esquema de las labores del método —rampas, subniveles, chimeneas— trazado por el equipo con las formas del PPT o fotografiado de un croquis a mano; (2) las 5 operaciones unitarias con sus equipos y materiales; (3) cuadro comparativo de los dos métodos. Se sustenta en 10 min y cada integrante responde por la parte que expuso.", "variante_a": "Veta Esperanza · potencia 1.2 m · buzamiento 65° · RMR 50 en cajas", "variante_b": "Veta Rosario · potencia 0.8 m · buzamiento 78° · RMR 38 en cajas", "evaluacion_lamina": "Cada equipo entrega un PPT con el esquema de labores, las operaciones del ciclo y el cuadro comparativo, y lo sustenta en 10 min. Se evalúa con rúbrica de 5 criterios (20 pts)."}, {"caso_id": "CASO-EOM-METEXP-2", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B2", "indicador_id": "IND-EOM-METEXP-3", "descripcion": "'Verificación de los métodos para el yacimiento Tres Cerros' (voz de equipo, nivel técnico, avanzado I3). Yacimiento con 3 zonas: A (veta angosta 0.5 m, RMR 35), B (cuerpo masivo 15 m, RMR 60), C (transición con agua), con límites de dilución/recuperación y estándares de seguridad. Planeamiento asignó preliminarmente un método por zona. El superintendente encarga al EQUIPO técnico VERIFICAR si el método asignado corresponde a las condiciones de cada zona, indicar equipos/materiales (perforación, sostenimiento según RMR, bombeo en Zona C) y los controles del técnico (dilución, sostenimiento, ventilación, desagüe), analizar los trade-offs entre zonas, y REPORTAR si confirma o recomienda cambiar el método de alguna zona. Producto: reporte de verificación + sustentación. Roles: cada integrante verifica una zona (A/B/C) + uno integra trade-offs y reporte final.", "pregunta_gatilladora": "¿Qué implicancias tiene para la operación y la seguridad que el método aplicado en una zona no corresponda a sus condiciones reales?", "recursos": "Libro de métodos de explotación subterránea; guía de control geotécnico/sostenimiento; ficha de datos de Tres Cerros (por zona); tablas de clasificación geomecánica (RMR)", "producto": "PPT de 8 a 10 diapositivas con: (1) esquema por zona de las labores del método aplicado; (2) equipos, materiales y control que corresponde a cada zona; (3) reporte de las desviaciones halladas —qué se esperaba y qué se encontró—. Se sustenta en 10 min y cada integrante responde por su zona.", "variante_a": "Tres Cerros · A: veta angosta 0.5 m RMR 35 · B: cuerpo masivo 15 m RMR 60 · C: tramo con agua", "variante_b": "San Genaro · A: veta angosta 0.7 m RMR 30 · B: cuerpo masivo 12 m RMR 65 · C: tramo con agua", "evaluacion_lamina": "Cada equipo entrega un PPT con la verificación de las 3 zonas y las desviaciones halladas, y lo sustenta en 10 min. Se evalúa con rúbrica de 5 criterios (20 pts)."}, {"caso_id": "CASO-MAT-1", "curso_id": "PM-MAT", "bloque_id": "PM-MAT-B1", "indicador_id": "IND-MAT-1", "descripcion": "Planta concentradora recibe lote de mineral de plomo con composición mineralógica compleja (galena, blenda, pirita, calcopirita, ganga); calcular contenido de Pb, Cu y Zn y la carga de ganga por tonelada de concentrado.", "pregunta_gatilladora": "¿Cómo podría esta composición mineralógica afectar la selección de reactivos y las condiciones de operación en la planta?", "recursos": "Tabla periódica; Calculadora"}, {"caso_id": "CASO-MAT-2", "curso_id": "PM-MAT", "bloque_id": "PM-MAT-B2", "indicador_id": "IND-MAT-2", "descripcion": "Determinar el volumen de carga óptimo de un molino y el balance metalúrgico de Cu, Pb, Zn y Ag mediante cálculos algebraicos, con cuadro de balance de masas y diagrama de flujo.", "pregunta_gatilladora": "Suponiendo que las leyes del relave son mayores a lo esperado, ¿qué soluciones darías para minimizar la pérdida de metales valiosos?", "recursos": "Tabla periódica; Calculadora; Formulario"}], "evaluaciones": [{"evaluacion_id": "EV-EOM-METEXP-CV1", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B1", "evento": "CV1", "indicador_id": "IND-EOM-METEXP-1", "dimension": "Conocimiento", "instrumento": "Cuestionario en plataforma", "peso": "5"}, {"evaluacion_id": "EV-EOM-METEXP-CV2", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B2", "evento": "CV2", "indicador_id": "IND-EOM-METEXP-3", "dimension": "Conocimiento", "instrumento": "Cuestionario en plataforma", "peso": "5"}, {"evaluacion_id": "EV-EOM-METEXP-EP", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B1", "evento": "EP", "indicador_id": "IND-EOM-METEXP-1;IND-EOM-METEXP-2", "dimension": "Conocimiento", "instrumento": "Cuestionario en plataforma", "peso": "20"}, {"evaluacion_id": "EV-EOM-METEXP-EF", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B2", "evento": "EF", "indicador_id": "IND-EOM-METEXP-1;IND-EOM-METEXP-2;IND-EOM-METEXP-3", "dimension": "Conocimiento", "instrumento": "Cuestionario en plataforma", "peso": "20"}, {"evaluacion_id": "EV-EOM-METEXP-TC1", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B1", "evento": "TC1", "indicador_id": "IND-EOM-METEXP-1;IND-EOM-METEXP-2", "dimension": "Habilidades", "instrumento": "Rúbrica de sustentación", "peso": "25"}, {"evaluacion_id": "EV-EOM-METEXP-TC2", "curso_id": "EOM-METEXP", "bloque_id": "EOM-METEXP-B2", "evento": "TC2", "indicador_id": "IND-EOM-METEXP-3", "dimension": "Habilidades", "instrumento": "Rúbrica d alquier integrante puede explicar cualquier parte.", "nivel_3": "El grupo responde las preguntas técnicas; algunos integrantes solo explican la parte que les tocó.", "nivel_2": "El grupo responde algunas preguntas técnicas; varios integrantes no explican lo que presentaron.", "nivel_1": "Uno o dos integrantes responden por todo el grupo."}], "observaciones": [{"observacion_id": "OBS-EOM-METEXP-1", "curso_id": "EOM-METEXP", "entidad": "rúbrica", "ref_id": "CASO-EOM-METEXP-2 (TC2)", "tipo": "error", "estado": "corregido", "descripcion": "La rúbrica del TC2 era de otro curso: decía 'Mineralogía y Petrología' y evaluaba inglés/comunicación oral (Interpretation, Accuracy, Vocabulary, Speaks clearly, Attitude). No evaluaba el caso real.", "sustento": "Rúbrica del TC2 rehecha y alineada al caso Tres Cerros (verificación por zona): 5 criterios (1-4), niveles acumulativos, componente individual; nota vigesimal = suma /20.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-2", "curso_id": "EOM-METEXP", "entidad": "caso", "ref_id": "CASO-EOM-METEXP-2 (TC2)", "tipo": "error", "estado": "corregido", "descripcion": "El TC2 citaba el indicador 'Diferencia las tareas del ciclo de minado', que NO existe en la triangulación (los 3 oficiales: Describe operaciones / Describe métodos / Explica selección).", "sustento": "Reasignado a IND-EOM-METEXP-1 (Describe las operaciones unitarias), que es lo que el caso realmente trabaja.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-3", "curso_id": "EOM-METEXP", "entidad": "rúbrica", "ref_id": "CASO-EOM-METEXP-1 (TC1)", "tipo": "mejora", "estado": "corregido", "descripcion": "La rúbrica del TC1 debía ajustarse al caso reorientado.", "sustento": "Rúbrica del TC1 rehecha: 5 criterios (1-4) alineados al caso (operaciones, métodos, equipos/materiales+controles, comparación, reporte+individual), niveles acumulativos; nota vigesimal = suma /20.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-4", "curso_id": "EOM-METEXP", "entidad": "contenido/bloque", "ref_id": "Bloque 2 (sesiones 7-12)", "tipo": "error", "estado": "corregido", "descripcion": "El Bloque 2 completo (sesiones 7-11) enseñaba perforación (diamantina, convencional, mecanizada, superficial) y servicios auxiliares — tema de otros cursos (Equipos y accesorios de perforación), NO de Métodos de explotación. Todas citaban el indicador de métodos pero enseñaban perforación: contenido desalineado del indicador.", "sustento": "Bloque 2 rediseñado a SELECCIÓN de métodos (indicador I3): criterios de selección, selección aplicada por tipo de yacimiento y combinación de métodos. Perforación/voladura quedan solo como operaciones unitarias en el Bloque 1 (I1). Raíz a escalar: la capacidad menciona 'equipos de voladura', inconsistente con los indicadores.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-5", "curso_id": "EOM-METEXP", "entidad": "aprendizaje esperado", "ref_id": "Sesiones 3-11", "tipo": "mejora", "estado": "corregido", "descripcion": "Los aprendizajes esperados eran formulaicos ('Aplicar los principios técnicos de X en un caso teórico-práctico'), genéricos, no decían el logro real.", "sustento": "Reescritos específicos por tema, alineados a los indicadores (describir/seleccionar).", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-6", "curso_id": "EOM-METEXP", "entidad": "caso", "ref_id": "CASO-EOM-METEXP-1 (TC1)", "tipo": "error", "estado": "corregido", "descripcion": "El TC1 exigía criterios de selección (productividad, costos, geomecánica) que se enseñan en el Bloque 2, no en el Bloque 1: pedía conocimiento aún no dado.", "sustento": "Reorientado a nivel básico (I1+I2): describir operaciones unitarias y caracterizar/comparar métodos por condiciones de aplicación, sin productividad/costos. La selección con criterios queda para el TC2. Falta re-ajustar la rúbrica del TC1 al caso reorientado.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-7", "curso_id": "EOM-METEXP", "entidad": "sesiones", "ref_id": "Bloque 1", "tipo": "mejora", "estado": "corregido", "descripcion": "Las operaciones unitarias estaban comprimidas en una sola sesión (S1), pese a ser base del curso.", "sustento": "Repartidas en 2 sesiones (S1 perforación/voladura; S2 carguío/sostenimiento/servicios + clasificación); los métodos se agrupan 2 por sesión (S3-S5).", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-8", "curso_id": "EOM-METEXP", "entidad": "colaborativos", "ref_id": "TC1 y TC2", "tipo": "mejora", "estado": "corregido", "descripcion": "Los casos estaban en voz de gerente/ingeniero y sin el nivel real del técnico.", "sustento": "Rediseñados en voz de EQUIPO técnico (asistente que reporta/verifica), con problema real (Veta Esperanza / Tres Cerros), equipos y materiales concretos (jackleg/jumbo, scooptram, pernos/malla/shotcrete, bombeo) y controles del técnico, con roles y responsabilidad individual. Basado en investigación de las tareas reales del técnico.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-9", "curso_id": "EOM-METEXP", "entidad": "rúbrica CASO-EOM-METEXP-2 (TC2)", "ref_id": "criterios 3, 4 y 5", "tipo": "error", "estado": "corregido", "descripcion": "La rúbrica del TC2 calificaba por encima del nivel del egresado: pedía 'Recomendación sustentada' y 'analiza los trade-offs entre zonas'. Recomendar el método de explotación y evaluar trade-offs es decisión de ingeniería (NV3); el egresado es técnico operativo NV2.", "sustento": "Los verbos del curso son IDENTIFICAR (capacidad), DESCRIBE, DESCRIBE y EXPLICA (indicadores): ninguno dice recomendar ni seleccionar. Corregido acotando el OBJETO, no el verbo: el operador sí analiza, pero su labor — verifica si el método corresponde, identifica el control que le toca, detecta la desviación y la reporta. Es el mismo error ya registrado en OBS-EOM-METEXP-6 para el TC1: se corrigió el caso y la rúbrica quedó arriba.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-10", "curso_id": "EOM-METEXP", "entidad": "capacidad e indicadores", "ref_id": "CAP-EOM-METEXP", "tipo": "error", "estado": "detectado", "descripcion": "La capacidad de Métodos de explotación es la de OTRO CURSO del mismo módulo: 'Explosivos y accesorios de voladura'. Es la misma frase recortada — se le quitó 'en minería subterránea y superficial' y se le puso 'en situaciones planteadas'. El curso queda SIN CAPACIDAD PROPIA y sus tres indicadores (operaciones unitarias, métodos, selección del método) quedan huérfanos: no cuelgan de ninguna capacidad que hable de eso.", "sustento": "Comparadas las capacidades de los 5 cursos del Módulo 2 (UC02) en sus triangulaciones: Sostenimiento, Fundamentos mecánicos y Equipos de perforación tienen capacidad propia y bien redactada; solo Métodos de explotación duplica la de Explosivos. Explica de una vez los otros dos hallazgos del curso: los contenidos de perforación y voladura que sobraban (OBS-4) y la rúbrica del TC2 que era de otro curso (OBS-1). No es un error suelto: es el patrón con que se armó el paquete. CORRECCIÓN a dos diagnósticos previos: no es 'la capacidad de la unidad de competencia del módulo' —esa lectura salió de la sumilla y era demasiado generosa—, es una copia entre cursos hermanos. Requiere corrección del documento oficial y aprobación de Walther Alcocer.", "decision": "Capacidad propia aprobada, pendiente de trámite: «Identificar los métodos de explotación minera subterránea y superficial que corresponden a las características del yacimiento, así como las operaciones unitarias del ciclo de minado, de acuerdo con los estándares, especificaciones técnicas y procedimientos operativos en situaciones planteadas.» Cubre los tres indicadores (operaciones unitarias / métodos y características / correspondencia con el yacimiento) y conserva el verbo y la cola de las capacidades hermanas del módulo. Dice 'que corresponden a' y no 'seleccionar' porque reconocer el método es NV2 y decidirlo es NV3. La base sigue mostrando la capacidad OFICIAL hasta que se corrija el sílabo: si el CSV se adelanta, nadie sabe cuál manda.", "aprobado_por": "Walther Alcocer · 2026-08-13 (redacción aprobada; falta tramitar 7A/sílabo)"}, {"observacion_id": "OBS-EOM-METEXP-11", "curso_id": "EOM-METEXP", "entidad": "triangulación y sílabo", "ref_id": "Propósito y relevancia", "tipo": "error", "estado": "detectado", "descripcion": "El párrafo de Propósito dice 'al finalizar la unidad didáctica de EXPLORACIÓN Y OPERACIÓN MINERA el estudiante podrá...'. Ese es el nombre del PROGRAMA de estudios, no de la unidad didáctica, que es 'Métodos de explotación'.", "sustento": "Error de copia al armar el paquete: el mismo párrafo aparece en la triangulación y en el sílabo. Es de forma y no afecta el diseño, pero está en un documento que recibe el estudiante.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-EOM-METEXP-12", "curso_id": "EOM-METEXP", "entidad": "indicador IND-EOM-METEXP-2", "ref_id": "IND-EOM-METEXP-2", "tipo": "observacion", "estado": "corregido", "descripcion": "El indicador 2 dice 'los PRINCIPALES métodos de explotación minera' sin decir cuántos ni cuáles. Sin número, dos evaluadores califican distinto el mismo trabajo. Los contenidos sí los nombran: corte y relleno, sublevel stoping, cámaras y pilares, block caving, sublevel caving y superficial (seis).", "sustento": "El indicador NO se reformula: baja del 7A. La precisión se pone donde sí es nuestra — en la rúbrica y en el aprendizaje esperado de cada sesión, que acotan a los seis métodos del curso. Se obtiene la misma consistencia de calificación sin gastar la excepción de la regla 2, que conviene reservar para lo de fondo (capacidad e indicador 3).", "decision": "Opción A · no se toca el indicador; la precisión va a la rúbrica y al aprendizaje esperado", "aprobado_por": "Walther Alcocer · 2026-08-13"}, {"observacion_id": "OBS-EOM-METEXP-13", "curso_id": "EOM-METEXP", "entidad": "contenidos", "ref_id": "Sesiones 8, 9 y 10", "tipo": "error", "estado": "corregido", "descripcion": "Las sesiones 8, 9 y 10 enseñaban y pedían justificar con CRITERIOS DE COSTO y PRODUCTIVIDAD (inversión de preparación vs costo de operación, TM/Hg, dilución). El estudiante no tiene base para eso.", "sustento": "Itinerario verificado: los cuatro cursos previos del ciclo I son Mineralogía y petrología, Cartografía geológica y geomecánica, Prospección y exploración geológica, y Geología de yacimientos minerales. NINGUNO de matemática, costos ni economía. No es un contenido difícil: es un contenido sin prerrequisito en el itinerario. En cambio SÍ traen base geomecánica (RMR) del ciclo I, que es lo que alimenta las condiciones de aplicación y el método Nicholas.", "decision": "Se retiran los criterios de costo y productividad de S8, S9 y S10; el bloque 2 se apoya en condiciones geológicas y geomecánicas", "aprobado_por": "Walther Alcocer · 2026-08-13"}, {"observacion_id": "OBS-EOM-METEXP-14", "curso_id": "EOM-METEXP", "entidad": "contenidos", "ref_id": "Sesiones 8 y 11", "tipo": "mejora", "estado": "detectado", "descripcion": "El método Nicholas (sistema de puntuación para selección de métodos de explotación) daría a la verificación método–zona un sustento numérico y reproducible, en lugar de depender del criterio del corrector. Está en la bibliografía oficial del curso: López Aburto, 'Manual para la selección de métodos de explotación de minas' (1994).", "sustento": "Se usaría para VERIFICAR (NV2: comparar con el método ya aplicado), no para SELECCIONAR (NV3). Se alimenta de forma, potencia, buzamiento y RMR — todo lo que el alumno trae del ciclo I. No se incorpora ahora: sin la fuente a la vista, las tablas de puntuación se inventarían.", "decision": "No se incorpora en esta versión; el bloque 2 se sostiene con las condiciones de aplicación de S3-S5", "aprobado_por": "Walther Alcocer · 2026-08-13"}, {"observacion_id": "OBS-EOM-METEXP-15", "curso_id": "EOM-METEXP", "entidad": "contenidos", "ref_id": "S1 y S2 · operaciones unitarias", "tipo": "observacion", "estado": "corregido", "descripcion": "Se metió VENTILACIÓN y después DESATADO entre las operaciones unitarias del ciclo. Ninguna de las dos lo es. Las cinco son las que la base ya tenía: perforación, voladura, carguío, acarreo y sostenimiento.", "sustento": "Definición de operación unitaria: etapa que TRANSFORMA O DESPLAZA EL MATERIAL, con equipo, insumo y producto propios, medible por sí sola. Desatado y ventilación no le hacen nada al material: previenen un riesgo. La fuente consultada (Ccaso Yucasi, UNAP, §2.6) las enumera junto a las demás, pero al definir el desatado dice 'es LA ACTIVIDAD que consiste en hacer caer las rocas sueltas ANTES, DURANTE Y DESPUÉS de las labores': lo que acompaña a todas las etapas no es una de ellas. LECCIÓN: ir a la fuente no basta — hay que leer la DEFINICIÓN, no la enumeración, porque una fuente responde la pregunta que ella se hace, no la nuestra.", "decision": "El ciclo queda con las 5 originales. Desatado, ventilación y drenaje se dibujan como condiciones permanentes de seguridad, rodeando el ciclo — no dentro.", "aprobado_por": "Walther Alcocer · 2026-08-13"}, {"observacion_id": "OBS-PM-MAT-1", "curso_id": "PM-MAT", "entidad": "indicadores", "ref_id": "IND-MAT-1/2/3", "tipo": "error", "estado": "detectado", "descripcion": "Los tres indicadores de logro están cargados sin descripción: solo existe el ID.", "sustento": "Sin el texto del indicador no se puede comprobar si la rúbrica califica lo que el curso promete, ni si el aprendizaje esperado de cada sesión le corresponde. Bajan del formato 7A: hay que transcribirlos del sílabo, no redactarlos.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-PM-MAT-2", "curso_id": "PM-MAT", "entidad": "colaborativos", "ref_id": "TC1 y TC2", "tipo": "mejora", "estado": "detectado", "descripcion": "IND-MAT-3 no se evalúa en ningún trabajo colaborativo: TC1 cubre IND-1 (20 pts) y TC2 cubre IND-2 (20 pts); el tercero queda en 0.", "sustento": "Detectado por revisar_rubricas.py al enlazar cada criterio con su indicador. Puede ser correcto —el indicador 3 podría evaluarse en el examen final— pero hay que decidirlo, no dejarlo al azar.", "decision": "", "aprobado_por": ""}, {"observacion_id": "OBS-PM-MAT-3", "curso_id": "PM-MAT", "entidad": "aprendizaje esperado", "ref_id": "sesiones 1-12", "tipo": "mejora", "estado": "detectado", "descripcion": "Las 12 sesiones repiten el mismo aprendizaje esperado ('Resolver problemas aplicados al procesamiento de minerales...'), sin distinguir qué logra cada una.", "sustento": "Es el mismo defecto ya corregido en EOM (OBS-EOM-METEXP-5): si todas las sesiones prometen lo mismo, el aprendizaje esperado no gobierna el diseño de ninguna. Los temas sí difieren (fracciones, conversión de unidades, regla de tres).", "decision": "", "aprobado_por": ""}], "laminas": [{"lamina_id": "L001", "sesion_id": "EOM-METEXP-S1", "orden": "1", "tipo": "portada", "momento": "", "minutos": "0", "titulo": "MÉTODOS DE EXPLOTACIÓN", "texto": "SEDE ABQ", "imagen_id": ""}, {"lamina_id": "L002", "sesion_id": "EOM-METEXP-S1", "orden": "2", "tipo": "subportada-sesion", "momento": "", "minutos": "0", "titulo": "Sesión N°1", "texto": "Ciclo de minado y operaciones unitarias I: perforación y voladura", "imagen_id": ""}, {"lamina_id": "L003", "sesion_id": "EOM-METEXP-S1", "orden": "3", "tipo": "subportada-momento", "momento": "conexion", "minutos": "0", "titulo": "CONEXIÓN", "texto": "", "imagen_id": ""}, {"lamina_id": "L005", "sesion_id": "EOM-METEXP-S1", "orden": "4", "tipo": "contenido", "momento": "conexion", "minutos": "12", "titulo": "Veo – Pienso – Me pregunto", "texto": "¿Qué VEO en esta labor?\n¿Qué PIENSO que está pasando ahí?\n¿Qué ME PREGUNTO?", "imagen_id": ""}, {"lamina_id": "L004", "sesion_id": "EOM-METEXP-S1", "orden": "5", "tipo": "triangulacion", "momento": "conexion", "minutos": "8", "titulo": minutos": "5", "rutina": "", "actividad": "Dónde caen perforación y voladura dentro de la secuencia completa del ciclo.", "materiales": "Esquema del ciclo"}, {"actividad_id": "ACT-EOM-METEXP-S1-07", "sesion_id": "EOM-METEXP-S1", "orden": "7", "momento": "aplicacion", "minutos": "15", "rutina": "Ponerse dentro", "actividad": "En equipos de 3: cada equipo recibe el rol de un operador —perforista o cargador de explosivos— y describe su turno: qué hace, en qué orden, con qué equipo y qué materiales.", "materiales": "Ficha de rol por equipo"}, {"actividad_id": "ACT-EOM-METEXP-S1-08", "sesion_id": "EOM-METEXP-S1", "orden": "8", "momento": "aplicacion", "minutos": "25", "rutina": "", "actividad": "El equipo completa la ficha de las dos operaciones: función · equipos · materiales · resultado esperado.", "materiales": "Ficha de operaciones"}, {"actividad_id": "ACT-EOM-METEXP-S1-09", "sesion_id": "EOM-METEXP-S1", "orden": "9", "momento": "discusion", "minutos": "20", "rutina": "Afirmación–Apoyo–Pregunta", "actividad": "Dos equipos exponen su ficha y el resto contrasta. Cada intervención se formula como 'afirmo… me apoyo en… me pregunto…'.", "materiales": ""}, {"actividad_id": "ACT-EOM-METEXP-S1-10", "sesion_id": "EOM-METEXP-S1", "orden": "10", "momento": "reflexion", "minutos": "4", "rutina": "Titular", "actividad": "Cada estudiante escribe un titular de una línea que capture qué es el ciclo de minado.", "materiales": ""}, {"actividad_id": "ACT-EOM-METEXP-S1-11", "sesion_id": "EOM-METEXP-S1", "orden": "11", "momento": "reflexion", "minutos": "6", "rutina": "", "actividad": "Cierre: la siguiente sesión completa el ciclo con carguío, acarreo y sostenimiento.", "materiales": ""}], "curso_detalle": [{"curso_id": "EOM-METEXP", "sumilla": "Unidad didáctica de Métodos de explotación (EOM), teórico-práctica, periodo II, modalidad virtual. Busca que el estudiante conozca las principales técnicas de explotación minera subterránea y superficial y sepa relacionarlas con las condiciones del yacimiento, los procedimientos y la normativa vigente.", "proposito": "El técnico en EOM adquiere conocimientos teóricos y prácticos sobre los métodos de explotación: describir las operaciones unitarias del ciclo de minado, describir los principales métodos y explicar la selección del método según el tipo de yacimiento y las condiciones geológicas, geomecánicas y de seguridad, integrando la seguridad ocupacional y el cuidado ambiental.", "materiales": "Presentaciones; laptop; videos; pizarra digital", "bibliografia": "Herrera Herbert & Gómez Jaén (2007), Diseño de Explotaciones e Infraestructuras Mineras Subterráneas (UPM); Llanque et al. (1999), Explotación subterránea: métodos y casos prácticos (UNA Puno); López Aburto (1994), Manual para la selección de métodos de explotación de minas."}]};
const $ = (s)=>document.querySelector(s);
const esc = (t)=>(t||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let carrera = "Todas", cursoSel = null;

const porCurso = (t,id)=> (D[t]||[]).filter(r=>r.curso_id===id);
const sesionesDe = (id)=> porCurso("sesiones",id).sort((a,b)=>+a.nro_sesion-+b.nro_sesion);
const contenidosDe = (sid)=> (D.contenidos||[]).filter(r=>r.sesion_id===sid);
const laminasDe = (sid)=> (D.laminas||[]).filter(r=>r.sesion_id===sid).sort((a,b)=>+a.orden-+b.orden);
const imagen = (iid)=> (D.imagenes||[]).find(r=>r.imagen_id===iid);

function pintarLista(){
  const cs = D.cursos.filter(c=> carrera==="Todas" || c.sigla===carrera);
  const mods = {};
  cs.forEach(c=> (mods[c.modulo||"—"] = mods[c.modulo||"—"]||[]).push(c));
  $("#lista").innerHTML = Object.entries(mods).map(([m,l])=>
    `<div class="modulo">${esc(m)}</div>` + l.map(c=>{
      const n = sesionesDe(c.curso_id).length;
      return `<div class="curso ${c.curso_id===cursoSel?'on':''}" onclick="verCurso('${c.curso_id}')">
        ${esc(c.nombre_curso)}<small>${c.sigla} · ${c.horas_total} h · ${n?n+' sesiones':'solo ficha'}</small></div>`;
    }).join("")).join("");
  $("#hdr").textContent = `${cs.length} cursos`;
}

function validar(id){
  const ses = sesionesDe(id), ev = porCurso("evaluaciones",id);
  const conts = ses.flatMap(s=>contenidosDe(s.sesion_id));
  const inds = (D.indicadores||[]).filter(i=> porCurso("capacidades",id).some(c=>c.capacidad_id===i.capacidad_id));
  const peso = ev.reduce((a,e)=>a+(parseFloat(e.peso)||0),0);
  const sinAE = ses.filter(s=>s.tipo_sesion==="adquisicion" && !s.aprendizaje_esperado).length;
  const indSinUso = inds.filter(i=> !conts.some(c=>c.indicador_id===i.indicador_id)).length;
  const lam = ses.flatMap(s=>laminasDe(s.sesion_id));
  const ESQUELETO = 10, TEORIA_MAX = 13;   // formato fijo del PPT 004A
  const excedidas = ses.filter(x=>laminasDe(x.sesion_id).length > 34).length;
  const teoriaMal = ses.filter(x=>laminasDe(x.sesion_id)
      .filter(y=>y.momento==="adquisicion").length > TEORIA_MAX).length;
  const malMin = ses.filter(s=>{const l=laminasDe(s.sesion_id);
      return l.length && l.reduce((a,x)=>a+(+x.minutos||0),0)!==135;}).length;
  const imgSinVer = lam.filter(l=>l.imagen_id && (imagen(l.imagen_id)||{}).estado!=="verificada").length;
  return [
    ["Los pesos de evaluación suman 100 %", ev.length? Math.round(peso)===100 : null, `${peso} %`],
    ["Toda sesión de adquisición tiene aprendizaje esperado", sinAE===0, `${sinAE} sin`],
    ["Todo contenido apunta a un indicador válido",
       conts.length? conts.every(c=>inds.some(i=>i.indicador_id===c.indicador_id)) : null, `${conts.length} contenidos`],
    ["Cada indicador se trabaja en algún contenido", inds.length? indSinUso===0 : null, `${indSinUso} sin trabajar`],
    ["Cada sesión suma 135 min", lam.length? malMin===0 : null, `${malMin} fuera`],
    ["Ninguna sesión pasa de 34 diapositivas", lam.length? excedidas===0 : null, `${excedidas} exceden`],
    ["La teoría no pasa de 13 diapositivas", lam.length? teoriaMal===0 : null, `${teoriaMal} exceden`],
    ["Ninguna lámina usa una imagen sin verificar", lam.length? imgSinVer===0 : null, `${imgSinVer} sin verificar`],
  ];
}

function verCurso(id){
  cursoSel = id; pintarLista();
  const c = D.cursos.find(x=>x.curso_id===id);
  const caps = porCurso("capacidades",id);
  const inds = (D.indicadores||[]).filter(i=>caps.some(x=>x.capacidad_id===i.capacidad_id));
  const ses = sesionesDe(id);
  const casos = porCurso("casos",id);
  const obs = porCurso("observaciones",id);

  let h = `<h1>${esc(c.nombre_curso)}</h1><div class="meta">${esc(c.carrera)} · ${esc(c.modulo)} ·
    Ciclo ${c.ciclo} · ${c.horas_total} h · ${c.creditos} cr · ${c.tipo}</div>`;

  if(caps.length){
    h += `<h2>Capacidad e indicadores</h2><div class="caja">`;
    caps.forEach(k=> h += `<div style="margin-bottom:8px">${esc(Object.values(k).slice(-1)[0])}</div>`);
    inds.forEach((i,n)=> h += `<div class="ind"><b>IND-${n+1}</b> · ${esc(Object.values(i).slice(-1)[0])}</div>`);
    h += `</div>`;
  }

  h += `<h2>Validaciones</h2><div class="caja">` + validar(id).map(([t,ok,d])=>
    `<div class="val">${ok===null?'<span style="color:#adb5bd">○</span>':
      ok?'<span class="si">✔</span>':'<span class="no">✘</span>'} ${t}
      <b style="color:var(--suave);font-size:12px"> ${d}</b></div>`).join("") + `</div>`;

  h += `<h2>Sesiones</h2>`;
  if(!ses.length) h += `<div class="vacio">Este curso tiene solo la ficha: aún no se ha detallado el diseño.</div>`;
  ses.forEach(s=>{
    const cts = contenidosDe(s.sesion_id), lms = laminasDe(s.sesion_id);
    const ev = s.tipo_sesion!=="adquisicion";
    h += `<div class="ses"><div onclick="this.nextElementSibling.classList.toggle('on')">
      <span class="n ${ev?'ev':''}">S${s.nro_sesion}</span>
      <div class="ae"><b>${esc(s.tema)}</b><small>${esc(s.aprendizaje_esperado)}</small></div></div>
      <div class="detalle">`;
    if(cts.length){
      h += `<div class="sub">Puntos clave</div><ul>` +
        cts.map(x=>`<li>${esc(x.contenido)}</li>`).join("") + `</ul>`;
    }
    const caso = casos.find(k=>k.bloque_id===s.bloque_id);
    if(ev && caso) h += `<div class="sub">Evaluación · caso del bloque</div>
      <div style="font-size:13.5px">${esc(Object.values(caso).slice(-2)[0])}</div>`;
    if(lms.length){
      const tot = lms.reduce((a,x)=>a+(+x.minutos||0),0);
      const dia = lms.length;   // una fila = una diapositiva
      h += `<div class="sub">Guion del PPT — ${dia} diapositivas · ${tot} min
</div>
        <table><tr><th>#</th><th>Tipo</th><th>Momento</th><th>min</th><th>Diapositiva</th><th>Imagen</th></tr>` +
        lms.map(l=>{
          const im = imagen(l.imagen_id);
          return `<tr><td>${l.orden}</td>
            <td><b style="font-size:11.5px">${esc(l.tipo||"")}</b></td>
            <td>${l.momento? `<span class="mom m-${l.momento}">${l.momento}</span>`:""}</td>
            <td>${l.minutos}</td>

            <td><b>${esc(l.titulo)}</b><br><span style="color:var(--suave)">${esc(l.texto)}</span></td>
            <td>${im? esc(im.tema)+(im.estado==="verificada"?' <span class="si">✔</span>':' <span class="no">sin verificar</span>')
                    : '<span style="color:#ced4da">—</span>'}</td></tr>`;
        }).join("") + `</table>`;
    }
    h += `</div></div>`;
  });

  if(obs.length){
    h += `<h2>Observaciones registradas</h2><div class="caja">` + obs.map(o=>{
      const v = Object.values(o);
      return `<div class="val">${o.estado==="corregido"?'<span class="si">✔</span>':'<span class="no">●</span>'}
        <b style="font-size:12px">${esc(o.tipo)}</b> ${esc(v[v.length-2])}</div>`;
    }).join("") + `</div>`;
  }
  $("#main").innerHTML = h;
}

$("#filtros").innerHTML = ["Todas","EOM","SI","PM"].map(c=>
  `<button onclick="carrera='${c}';document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('on'));event.target.classList.add('on');pintarLista()"
   class="${c==='Todas'?'on':''}">${c}</button>`).join("");
pintarLista();
$("#main").innerHTML = `<h1>Elige un curso</h1><div class="meta">
  La lista de la izquierda tiene los cursos técnicos de las tres carreras.
  Al abrir uno se ven su capacidad, sus sesiones y —si está detallado— el guion de cada PPT.</div>`;
</script></body></html>
